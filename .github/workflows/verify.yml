name: Verificación de VISION AI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vision-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar dependencias bloqueadas
        run: npm ci --no-audit --no-fund
      - name: Verificar arquitectura tipos y contratos
        run: npm run check
      - name: Instalar dependencias mínimas de verificación de Render
        run: python3 -m pip install -r backend/requirements-render-free.txt "httpx>=0.28,<1"
      - name: Comprobar referencias Python y API gratuita
        run: python3 -m unittest discover -s tests
      - name: Smoke test HTTP Render Free en producción
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          url = "https://vision-ai-api.onrender.com"
          last_error = None
          for attempt in range(5):
              try:
                  with urlopen(Request(url + "/api/v1/health", headers={"Accept":"application/json"}),timeout=40) as response:
                      status,headers = response.status,response.headers
                      payload = json.load(response)
                  assert status == 200, f"HTTP {status}"
                  assert payload["ok"] is True
                  assert payload["mode"] == "render-free-status-only"
                  assert payload["source"] == "four-3d-simulations-only"
                  assert payload["inferenceAvailable"] is False
                  assert payload["modelLoaded"] is False
                  assert set(payload["configuredScenarios"]) == {"safety","quality","retail","warehouse"}
                  assert headers.get("X-Content-Type-Options") == "nosniff"
                  assert headers.get("Cache-Control") == "no-store"
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 4:
                      raise
                  time.sleep(8)
          print("RF04 LIVE: Render Free GET /api/v1/health = 200, cuatro escenas, inferencia remota desactivada")
          try:
              urlopen(Request(url + "/api/v1/infer",data=b"not-an-image",method="POST"),timeout=30)
              raise AssertionError("RF05: inferencia remota habilitada por error")
          except HTTPError as response:
              assert response.code == 503, f"RF05: HTTP {response.code}, esperado 503"
          print("RF05 LIVE: Render Free POST /api/v1/infer = 503; ningún fotograma enviado")
          PY
      - name: Compilar aplicación
        run: npm run build

      - name: QA responsive en Chromium (360, 768 y 1440 px)
        run: node scripts/qa-responsive.mjs
      - name: Guardar capturas del QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vision-ai-responsive
          path: qa-artifacts/*
          if-no-files-found: ignore
          retention-days: 7
