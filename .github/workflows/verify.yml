name: Verificación de VISION AI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vision-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar dependencias bloqueadas
        run: npm ci --no-audit --no-fund
      - name: Verificar arquitectura tipos y contratos
        run: npm run check
      - name: Comprobar referencias Python
        run: python3 -m unittest discover -s tests
      - name: Compilar aplicación
        run: npm run build

      - name: QA responsive en Chromium (360, 768 y 1440 px)
        run: node scripts/qa-responsive.mjs
      - name: Guardar capturas del QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vision-ai-responsive
          path: qa-artifacts/*
          if-no-files-found: ignore
          retention-days: 7
